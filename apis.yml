aid: alto-pharmacy
name: Alto Pharmacy
description: 'Alto Pharmacy is a San Francisco-based digital pharmacy and pharmacy-technology
  company (founded 2015 as ScriptDash) that combines a full-service licensed pharmacy
  with a proprietary pharmacy operating system, Alto OS. Alto fills retail, specialty
  and fertility prescriptions with same-day courier delivery, pharmacist care and
  automated benefits investigation, and it sells that stack to industry partners as
  Alto Hub+, Alto Dispensing and Alto Complete — hub services, dispensing and end-to-end
  pharmacy-as-a-service for pharmaceutical manufacturers, health plans, health systems
  and digital health companies. Alto markets intake, transfer and Surescripts-based
  integrations to those partners, but publishes no public developer portal, API
  documentation or machine-readable specification; technical access runs through its
  partnerships team.'
